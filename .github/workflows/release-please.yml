name: Release Please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: master
          token: ${{ secrets.GITHUB_TOKEN }}

      # release-please зовёт релиз `windows11-manager: v4.1.0`; событие
      # `release: published` от GITHUB_TOKEN workflow не запускает, поэтому
      # заголовок правится здесь же, а не в Release Title.
      - name: Set release title
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: node scripts/release-title.js "$TAG"

      - name: Get release PR number
        if: steps.release.outputs.pr != ''
        id: pr
        env:
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: echo "number=$(echo "$PR_JSON" | jq -r '.number')" >> $GITHUB_OUTPUT

      - name: Sync Tauri version to release PR
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh pr checkout $PR_NUMBER
          node scripts/sync-tauri-version.js
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tauri-app/package.json tauri-app/src-tauri/tauri.conf.json tauri-app/src-tauri/Cargo.toml
          git diff --staged --quiet || git commit -m "chore: sync tauri-app version"
          git push origin HEAD || true
