[package]
name = "windows11-manager-tray"
version = "4.0.1"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "macros"] }
log = "0.4"
fern = "0.7"
chrono = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Секции не было вовсе, то есть профиль брался умолчаниями — и это верно:
# `lto` тут не заводили, и заводить не надо (у соседнего пикера fat-LTO стоил
# 208 с против 70 без него). Не хватало одной строки.
#
# Замерено на целевой Windows-машине (i5-12600K, 16 потоков), пересборка после
# правки одной строки в `lib.rs`: 78,7 с без неё и 13,8 с с ней, по два
# прогона, разброс в пределах секунды. `--timings` показывает, что всё это
# время — один юнит `app_lib`, зависимости не пересобираются вовсе.
#
# Цена — место в `target/`: инкрементальные кеши растут. Она оправдана, пока
# сборка идёт на машине разработчика, а не в одноразовом CI.
[profile.release]
incremental = true
